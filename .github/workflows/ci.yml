name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Lint
        run: selene src

      - name: Format
        run: stylua --check src
